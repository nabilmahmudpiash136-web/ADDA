{% extends "base.html" %}
{% block title %}একাউন্ট তৈরি — আড্ডা{% endblock %}
{% block auth_content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">আড্ডা</div>
    <p class="auth-tag">নতুন একাউন্ট তৈরি করো — এক নাম্বার বা এক জিমেইল দিয়ে একটাই একাউন্ট হবে</p>
    <form method="POST">
      <div class="field">
        <label>নাম</label>
        <input type="text" name="name" placeholder="তোমার নাম" required>
      </div>
      <div class="id-type-toggle">
        <label class="type-opt"><input type="radio" name="id_type" value="phone" checked> ফোন নাম্বার</label>
        <label class="type-opt"><input type="radio" name="id_type" value="email"> জিমেইল</label>
      </div>
      <div class="field">
        <label>ফোন নাম্বার অথবা জিমেইল</label>
        <input type="text" name="identifier" placeholder="01XXXXXXXXX অথবা you@gmail.com" required>
      </div>
      <div class="field">
        <label>পাসওয়ার্ড</label>
        <input type="password" name="password" required>
      </div>
      <button class="btn-primary" type="submit">একাউন্ট তৈরি করো</button>
    </form>
    <div class="switch-line">আগে থেকেই একাউন্ট আছে? <a href="{{ url_for('login') }}">লগইন করো</a></div>
  </div>
</div>
{% endblock %}
